[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mhcmtn-code"
version = "0.1.1"
description = "A new implementation of manifold-aware hyperconnection optimization with causal STL-LSTM forecasting"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.2", "numpy>=1.26", "pandas>=2.1", "statsmodels>=0.14",
  "scikit-learn>=1.4", "xgboost>=2.0", "matplotlib>=3.8",
  "openpyxl>=3.1", "joblib>=1.3", "tzdata>=2024.1"
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.scripts]
mhcmtn = "mhcmtn.__main__:main"

[tool.setuptools.packages.find]
include = ["mhcmtn*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
